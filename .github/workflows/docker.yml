name: Docker laboratory 3
on:
  push:
    branches: [lab3-docker]
  workflow_dispatch:
jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'
      - name: Configure disposable environment
        run: cp .env.example .env
      - name: Build and start both services
        run: docker compose up --build -d --wait
      - name: Check health and non-root user
        run: |
          curl --fail http://127.0.0.1:4567/health
          test "$(docker compose exec -T web id -u)" = 1000
      - name: Original Hurl scenarios
        run: |
          docker run --rm --network traveler_lab3_backend -v "$PWD/tests:/tests:ro" ghcr.io/orange-opensource/hurl:8.0.0 --test --jobs 1 --variable host=http://web:4567 --variable timeout=5000 /tests/crud.hurl /tests/validation.hurl /tests/management.hurl /tests/race-conditions.hurl
      - name: Original concurrency scenarios
        run: docker run --rm --network container:traveler_lab3-web-1 -v "$PWD/tests:/app/tests:ro" traveler-api:lab3 node --test tests/concurrency.test.js
      - name: k6 smoke against containers
        env:
          RESULT_DIR: evidence/ci
        run: |
          mkdir -p evidence/ci
          k6 run tests/performance-tests/smoke-test.js
      - name: Save diagnostics
        if: always()
        run: |
          mkdir -p evidence/ci
          docker compose ps > evidence/ci/compose-ps.txt
          docker compose logs --no-color > evidence/ci/compose-logs.txt
          docker stats --no-stream > evidence/ci/stats.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-lab3-evidence
          path: evidence/ci
      - name: Stop services
        if: always()
        run: docker compose down
