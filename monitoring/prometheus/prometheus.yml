# Laboratory 7: Prometheus configuration for the sharded TravelerAPI.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  external_labels:
    lab: traveler-lab7

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Two stateless API instances (prom-client, GET /metrics).
  - job_name: traveler-api
    metrics_path: /metrics
    static_configs:
      - targets: ['web:4567', 'web2:4567']
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: api

  # One postgres_exporter per PostgreSQL service; each service holds 4 shards.
  - job_name: postgres
    static_configs:
      - targets: ['pg_exporter_00:9187']
        labels: {server: postgres_00}
      - targets: ['pg_exporter_01:9187']
        labels: {server: postgres_01}
      - targets: ['pg_exporter_02:9187']
        labels: {server: postgres_02}
      - targets: ['pg_exporter_03:9187']
        labels: {server: postgres_03}

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
