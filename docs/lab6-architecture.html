<!doctype html>
<meta charset="utf-8">
<title>Laboratory 6 architecture</title>
<style>
  body { margin: 0; padding: 14px; background: #fff; font-family: 'Segoe UI', Arial, sans-serif; }
  svg text { font-family: 'Segoe UI', Arial, sans-serif; }
  .box { fill: #f4f7fb; stroke: #4a6a8a; stroke-width: 1.4; }
  .api { fill: #e8f1fb; stroke: #1f5f9f; stroke-width: 1.6; }
  .pg { fill: #eef6ee; stroke: #2e7d32; stroke-width: 1.6; }
  .db { fill: #ffffff; stroke: #2e7d32; stroke-width: 1; }
  .reg { fill: #fff6e5; stroke: #c77700; stroke-width: 1.2; }
  .tool { fill: #f3eefb; stroke: #6a3fa0; stroke-width: 1.5; }
  .file { fill: #fffbe6; stroke: #a08a00; stroke-width: 1.3; }
  .t { font-size: 15px; font-weight: 600; fill: #1b2733; }
  .s { font-size: 12.5px; fill: #38485a; }
  .d { font-size: 12.5px; fill: #1b4d1e; font-weight: 600; }
  .sql { stroke: #1f5f9f; stroke-width: 1.4; fill: none; marker-end: url(#blue); }
  .rep { stroke: #c77700; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#orange); }
  .adm { stroke: #6a3fa0; stroke-width: 1.3; fill: none; stroke-dasharray: 3 3; marker-end: url(#violet); }
  .cfg { stroke: #a08a00; stroke-width: 1.3; fill: none; stroke-dasharray: 2 3; marker-end: url(#yellow); }
</style>
<svg width="1150" height="640" viewBox="0 0 1150 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f5f9f"/></marker>
    <marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c77700"/></marker>
    <marker id="violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6a3fa0"/></marker>
    <marker id="yellow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#a08a00"/></marker>
  </defs>

  <!-- client -->
  <rect class="box" x="455" y="10" width="240" height="52" rx="8"/>
  <text class="t" x="575" y="32" text-anchor="middle">Клієнт / k6 / Hurl</text>
  <text class="s" x="575" y="51" text-anchor="middle">HTTP 127.0.0.1:4567 і :4568</text>
  <path class="sql" d="M520,62 L400,108"/><path class="sql" d="M630,62 L750,108"/>

  <!-- APIs -->
  <rect class="api" x="250" y="110" width="300" height="112" rx="8"/>
  <text class="t" x="400" y="133" text-anchor="middle">web - TravelerAPI #1 (Node.js 22)</text>
  <text class="s" x="400" y="155" text-anchor="middle">shard = останній hex-символ UUID плану</text>
  <text class="s" x="400" y="174" text-anchor="middle">id генерує API: crypto.randomUUID()</text>
  <text class="s" x="400" y="193" text-anchor="middle">16 × pg.Pool (по 5 з’єднань)</text>
  <text class="s" x="400" y="212" text-anchor="middle">42501 → перечитати mapping → повтор</text>

  <rect class="api" x="600" y="110" width="300" height="112" rx="8"/>
  <text class="t" x="750" y="133" text-anchor="middle">web2 - TravelerAPI #2</text>
  <text class="s" x="750" y="155" text-anchor="middle">той самий образ traveler-api:lab6</text>
  <text class="s" x="750" y="174" text-anchor="middle">MAPPING_SOURCE = file | registry</text>
  <text class="s" x="750" y="193" text-anchor="middle">16 × pg.Pool (по 5 з’єднань)</text>
  <text class="s" x="750" y="212" text-anchor="middle">GET /api/travel-plans: scatter-gather</text>

  <!-- mapping file -->
  <rect class="file" x="20" y="120" width="190" height="92" rx="6"/>
  <text class="t" x="115" y="143" text-anchor="middle">mapping.json</text>
  <text class="s" x="115" y="163" text-anchor="middle">version + 16 шляхів</text>
  <text class="s" x="115" y="181" text-anchor="middle">host / port / database</text>
  <text class="s" x="115" y="199" text-anchor="middle">читають web і web2</text>
  <path class="cfg" d="M210,166 L248,166"/>

  <!-- tools -->
  <rect class="tool" x="935" y="110" width="200" height="112" rx="8"/>
  <text class="t" x="1035" y="133" text-anchor="middle">tools (CLI)</text>
  <text class="s" x="1035" y="155" text-anchor="middle">shard-exec.js: 2PC</text>
  <text class="s" x="1035" y="174" text-anchor="middle">на всіх 16 БД</text>
  <text class="s" x="1035" y="193" text-anchor="middle">rebalance.js: перенос</text>
  <text class="s" x="1035" y="212" text-anchor="middle">+ mapping.json і реєстр</text>

  <!-- SQL routes from APIs to nodes -->
  <path class="sql" d="M330,222 L140,330"/><path class="sql" d="M380,222 L420,330"/>
  <path class="sql" d="M420,222 L700,330"/><path class="sql" d="M470,222 L960,330"/>
  <path class="sql" d="M680,222 L190,330"/><path class="sql" d="M730,222 L470,330"/>
  <path class="sql" d="M770,222 L750,330"/><path class="sql" d="M820,222 L1000,330"/>
  <rect x="20" y="236" width="200" height="40" fill="#fff"/>
  <text class="s" x="22" y="252" fill="#1f5f9f">SQL до БД свого шарду</text>
  <text class="s" x="22" y="270" fill="#1f5f9f">SCRAM, лише мережа Compose</text>
  <path class="adm" d="M1035,222 L1060,330"/>
  <text class="s" x="1072" y="282" fill="#6a3fa0">до всіх</text>
  <text class="s" x="1072" y="298" fill="#6a3fa0">4 сервісів</text>

  <!-- PostgreSQL services -->
  <g>
    <rect class="pg" x="20" y="332" width="260" height="200" rx="10"/>
    <text class="t" x="150" y="356" text-anchor="middle">postgres_00</text>
    <rect class="db" x="38" y="368" width="105" height="30" rx="5"/><text class="d" x="90" y="388" text-anchor="middle">db_0</text>
    <rect class="db" x="157" y="368" width="105" height="30" rx="5"/><text class="d" x="209" y="388" text-anchor="middle">db_1</text>
    <rect class="db" x="38" y="406" width="105" height="30" rx="5"/><text class="d" x="90" y="426" text-anchor="middle">db_2</text>
    <rect class="db" x="157" y="406" width="105" height="30" rx="5"/><text class="d" x="209" y="426" text-anchor="middle">db_3</text>
    <rect class="reg" x="38" y="448" width="224" height="46" rx="5"/>
    <text class="d" x="150" y="467" text-anchor="middle" fill="#8a5200">shard_registry (master)</text>
    <text class="s" x="150" y="485" text-anchor="middle">PUBLICATION registry_pub</text>
    <text class="s" x="150" y="520" text-anchor="middle">PostgreSQL 16.15, wal_level=logical</text>
  </g>
  <g>
    <rect class="pg" x="300" y="332" width="260" height="200" rx="10"/>
    <text class="t" x="430" y="356" text-anchor="middle">postgres_01</text>
    <rect class="db" x="318" y="368" width="105" height="30" rx="5"/><text class="d" x="370" y="388" text-anchor="middle">db_4</text>
    <rect class="db" x="437" y="368" width="105" height="30" rx="5"/><text class="d" x="489" y="388" text-anchor="middle">db_5</text>
    <rect class="db" x="318" y="406" width="105" height="30" rx="5"/><text class="d" x="370" y="426" text-anchor="middle">db_6</text>
    <rect class="db" x="437" y="406" width="105" height="30" rx="5"/><text class="d" x="489" y="426" text-anchor="middle">db_7</text>
    <rect class="reg" x="318" y="448" width="224" height="46" rx="5"/>
    <text class="d" x="430" y="467" text-anchor="middle" fill="#8a5200">shard_registry (копія)</text>
    <text class="s" x="430" y="485" text-anchor="middle">SUBSCRIPTION registry_postgres_01</text>
    <text class="s" x="430" y="520" text-anchor="middle">max_prepared_transactions=64</text>
  </g>
  <g>
    <rect class="pg" x="580" y="332" width="260" height="200" rx="10"/>
    <text class="t" x="710" y="356" text-anchor="middle">postgres_02</text>
    <rect class="db" x="598" y="368" width="105" height="30" rx="5"/><text class="d" x="650" y="388" text-anchor="middle">db_8</text>
    <rect class="db" x="717" y="368" width="105" height="30" rx="5"/><text class="d" x="769" y="388" text-anchor="middle">db_9</text>
    <rect class="db" x="598" y="406" width="105" height="30" rx="5"/><text class="d" x="650" y="426" text-anchor="middle">db_a</text>
    <rect class="db" x="717" y="406" width="105" height="30" rx="5"/><text class="d" x="769" y="426" text-anchor="middle">db_b</text>
    <rect class="reg" x="598" y="448" width="224" height="46" rx="5"/>
    <text class="d" x="710" y="467" text-anchor="middle" fill="#8a5200">shard_registry (копія)</text>
    <text class="s" x="710" y="485" text-anchor="middle">SUBSCRIPTION registry_postgres_02</text>
    <text class="s" x="710" y="520" text-anchor="middle">окремий том pg02_data</text>
  </g>
  <g>
    <rect class="pg" x="860" y="332" width="270" height="200" rx="10"/>
    <text class="t" x="995" y="356" text-anchor="middle">postgres_03</text>
    <rect class="db" x="878" y="368" width="110" height="30" rx="5"/><text class="d" x="933" y="388" text-anchor="middle">db_c</text>
    <rect class="db" x="1002" y="368" width="110" height="30" rx="5"/><text class="d" x="1057" y="388" text-anchor="middle">db_d</text>
    <rect class="db" x="878" y="406" width="110" height="30" rx="5"/><text class="d" x="933" y="426" text-anchor="middle">db_e</text>
    <rect class="db" x="1002" y="406" width="110" height="30" rx="5"/><text class="d" x="1057" y="426" text-anchor="middle">db_f</text>
    <rect class="reg" x="878" y="448" width="234" height="46" rx="5"/>
    <text class="d" x="995" y="467" text-anchor="middle" fill="#8a5200">shard_registry (копія)</text>
    <text class="s" x="995" y="485" text-anchor="middle">SUBSCRIPTION registry_postgres_03</text>
    <text class="s" x="995" y="520" text-anchor="middle">ліміти: SHARD_CPUS / SHARD_MEMORY</text>
  </g>

  <!-- registry replication -->
  <path class="rep" d="M60,532 L60,565 L430,565 L430,536"/>
  <path class="rep" d="M60,565 L710,565 L710,536"/>
  <path class="rep" d="M60,565 L995,565 L995,536"/>
  <text class="s" x="570" y="588" text-anchor="middle" fill="#8a5200">логічна реплікація реєстру: registry_meta, shard_map, shard_moves</text>

  <!-- legend -->
  <g transform="translate(20,612)">
    <path class="sql" d="M0,8 L36,8"/><text class="s" x="44" y="12">SQL-запити API</text>
    <path class="rep" d="M190,8 L226,8"/><text class="s" x="234" y="12">логічна реплікація</text>
    <path class="adm" d="M390,8 L426,8"/><text class="s" x="434" y="12">адміністративні з’єднання CLI</text>
    <path class="cfg" d="M640,8 L676,8"/><text class="s" x="684" y="12">читання mapping.json</text>
  </g>
</svg>
